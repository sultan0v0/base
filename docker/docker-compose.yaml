services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    hostname: rabbitmq
    restart: unless-stopped
    env_file: .env
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rediska:
    image: redis:8.8.0-alpine3.23
    restart: unless-stopped
    env_file: .env
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --aclfile /etc/redis/users.acl
    volumes:
      - redis-data:/data
      - ./users.acl:/etc/redis/users.acl:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user default --pass \"$$REDIS_PASSWORD\" ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  pg_db:
    image: postgres:17-alpine3.23
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: ../application/.env
    depends_on:
      pg_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rediska:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pg-data:
  rabbitmq-data:
  redis-data:
